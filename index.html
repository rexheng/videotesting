<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Face + Shirt Tagger</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="page-header">
      <h1>Face + Shirt Tagger</h1>
      <p class="page-nav"><a href="shirtcheck.html">Play Shirt Check</a></p>
      <p id="status" role="status"></p>
    </header>

    <main class="layout">
      <div id="stage">
        <video id="camera" playsinline muted autoplay></video>
        <canvas id="overlay"></canvas>
      </div>

      <aside id="sidebar">
        <!-- Enabled once the face models have loaded. -->
        <button id="add-person" type="button" aria-controls="enrol-panel" disabled>Add person</button>
        <section id="enrol-panel" hidden></section>
        <h2 id="people-heading" tabindex="-1">People</h2>
        <ul id="people-list" aria-labelledby="people-heading"></ul>
      </aside>
    </main>

    <ul id="live-tags" class="visually-hidden"></ul>
    <pre id="debug" hidden></pre>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
