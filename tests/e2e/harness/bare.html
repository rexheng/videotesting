<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>Shirt Check still-image harness</title>
  </head>
  <body>
    <script type="module">
      import { loadShirtCheckModels, classifyStill } from '../../../src/shirtcheck/vision.js';

      const ready = loadShirtCheckModels({ runningMode: 'IMAGE' });
      window.modelsReady = ready.then(() => true);

      window.classify = async (url) => {
        const models = await ready;
        const image = await new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error(`Could not load ${url}`));
          img.src = url;
        });
        const result = classifyStill(models, image);
        return {
          pose: result.pose,
          torso: result.torso,
          reading: result.reading,
        };
      };
    </script>
  </body>
</html>
